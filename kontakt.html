<!doctype html>
<html lang="sv">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Boka bord – Kafé Kardemumma</title>
   </head>
   <body>
      <header>
         <h1>Kafé Kardemumma</h1>
         <nav aria-label="Huvudmeny">
            <ul>
               <li><a href="index.html">Startsida</a></li>
               <li><a href="index.html#meny">Meny</a></li>
               <li><a href="kontakt.html" aria-current="page">Boka bord</a></li>
            </ul>
         </nav>
      </header>

      <main>
         <h2>Boka bord</h2>
         <p>Fyll i formuläret så bekräftar vi din bokning inom ett dygn. Fält markerade med * är obligatoriska.</p>
         <!-- TODO: Skriv ingressen från innehall.md -->

         <form action="#" method="post">
            <article>
               <label for="namn">Namn *</label>
               <input type="text" id="namn" name="namn" required placeholder="Skriv ditt namn här" />
            </article>

            <article>
               <label for="epost">E-postadress *</label>
               <input type="email" id="epost" name="epost" required placeholder="namn@exempel.se" />
            </article>

            <article>
               <label for="telefon">Telefon (valfritt)</label>
               <input type="tel" id="telefon" name="telefon" />
            </article>

            <article>
               <label for="datum">Datum *</label>
               <input type="date" id="datum" name="datum" required placeholder="2026-10-28" />
            </article>

            <article>
               <!-- <input type="<div class="mb-3"> -->
               <label for="antal" class="form-label">Antal personer *</label>
               <select class="form-select form-select-lg" name="antal" required id="antal">
                  <option selected>Gör ett val</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="3">5 eller fler</option>
               </select>
            </article>

            <fieldset>
               <legend>Kostönskemål</legend>

               <input type="checkbox" id="vegetarisk" name="kost" value="vegetarisk" />
               <label for="vegetarisk">Vegetarisk</label>

               <input type="checkbox" id="vegansk" name="kost" value="vegansk" />
               <label for="vegansk">Vegansk</label>

               <input type="checkbox" id="glutenfri" name="kost" value="glutenfri" />
               <label for="glutenfri">Glutenfri</label>
            </fieldset>

            <fieldset>
               <legend>Hur vill du få bekräftelsen? *</legend>
               <!-- Räcker med required på en av radioknapparna. -->
               <input type="radio" id="epost" name="svar" value="epost" required />
               <label for="epost">E-post</label>

               <input type="radio" id="sms" name="svar" value="sms" />
               <label for="sms">SMS</label>
            </fieldset>

            <label for="onskemal">Övriga önskemål</label>
            <textarea>
               <input type="text" id="namn" name="namn" placeholder="Skriv ditt namn här" />
            </textarea>

            <article>
               <label for="namn">Jag godkänner att Kafé Kardemumma sparar mina uppgifter för bokningen. *</label>
               <input type="text" id="namn" name="namn" required placeholder="Skriv ditt namn här" />
            </article>
            <!-- TODO 1: fält för namn, e-post, telefon, datum (label + input med for/id) -->
            <!-- TODO 2: rullista för antal personer, textarea för önskemål -->
            <!-- TODO 3: fieldset + legend för kostönskemål och bekräftelsesätt -->
            <!-- TODO 4: samtyckeskryssruta (required) och skickaknapp -->
            <button type="submit">Skicka</button>
         </form>
      </main>

      <footer>
         <p>&copy; 2026 Kafé Kardemumma</p>
         <address>
            Fiktivgatan 1, 111 11 Stockholm<br />
            <a href="mailto:hej@kardemumma.example">hej@kardemumma.example</a>
         </address>
      </footer>
   </body>
</html>
